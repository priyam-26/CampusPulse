{% extends "base.html" %}
{% block title %}{{ meta.title }} — CampusPulse{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">{{ meta.icon }}</div>
    <h1>{{ meta.title }}</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="••••••••" required />
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-large">Sign In →</button>
    </form>
    <p class="auth-hint">{{ meta.hint }}</p>
  </div>
</div>
{% endblock %}
