{% extends "base.html" %}
{% block title %}Admin Login — CampusPulse{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1>Admin Login</h1>
    <p>Manage events, registrations and attendance</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary btn-large">Sign In →</button>
    </form>
    <p class="auth-hint">Authorized administrators only</p>
  </div>
</div>
{% endblock %}
